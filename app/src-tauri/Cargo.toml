[package]
name = "z-buddy-app"
version = "0.1.0"
description = "Z-Buddy desktop pet for ZCode"
authors = ["learnerCodeZ"]
edition = "2021"

[lib]
name = "z_buddy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
