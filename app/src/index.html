<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>z-buddy-pet</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="wrap">
    <div id="card">
      <div id="card-title">Z-Buddy · 团子</div>
      <div id="card-status">sleep</div>
      <div id="card-detail">未连接插件</div>
      <div id="card-hint">单击 = 暂停/恢复 · 拖动 = 挪位置</div>
    </div>
    <div id="pet" role="button" tabindex="0" aria-label="Z-Buddy 桌宠：单击暂停或恢复 Agent" data-tauri-drag-region>
      <canvas id="pet-canvas" width="128" height="128"></canvas>
      <div id="pause-badge" title="已暂停">⏸</div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
